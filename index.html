<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grocery Inventory Management (Static)</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Grocery Inventory Management</h1>

      <!-- This note explains why this version works on GitHub Pages -->
      <p class="info-note">
        Static mode: data is saved in your browser using localStorage.
      </p>

      <!-- Message area for success/error notifications -->
      <p id="message" class="message"></p>

      <div class="card">
        <h2 id="formTitle">Add New Item</h2>

        <!-- Form to add or update an item -->
        <form id="itemForm">
          <!-- Hidden field to store selected item id while editing -->
          <input type="hidden" id="itemId" />

          <div class="form-group">
            <label for="name">Item Name</label>
            <input type="text" id="name" placeholder="Example: Rice" required />
          </div>

          <div class="form-group">
            <label for="quantity">Quantity</label>
            <input type="number" id="quantity" placeholder="Example: 25" min="0" required />
          </div>

          <div class="form-group">
            <label for="price">Price</label>
            <input type="number" id="price" placeholder="Example: 120.50" step="0.01" min="0" required />
          </div>

          <div class="button-group">
            <button type="submit">Save Item</button>
            <button type="button" id="cancelBtn" class="secondary hidden">Cancel Edit</button>
          </div>
        </form>
      </div>

      <div class="card">
        <h2>Current Stock</h2>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Quantity</th>
                <th>Price</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="itemsTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
